<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stoppuhr – Anmeldung</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 26rem;">
  <h1 class="h4 mb-3">Stoppuhr</h1>
  <div class="card">
    <div class="card-body">
      {% if setup %}
      <h2 class="h6 mb-2">Zugang festlegen</h2>
      <p class="small text-muted">Es ist noch kein Zugang eingerichtet. Lege jetzt Benutzername und Kennwort fest.</p>
      {% else %}
      <h2 class="h6 mb-3">Anmelden</h2>
      {% endif %}
      <form id="form" autocomplete="on">
        <div class="mb-2">
          <label class="form-label" for="user">Benutzername</label>
          <input class="form-control" id="user" name="username" autocomplete="username" required maxlength="32">
        </div>
        <div class="mb-2">
          <label class="form-label" for="password">Kennwort</label>
          <input class="form-control" id="password" name="password" type="password"
                 autocomplete="{{ 'new-password' if setup else 'current-password' }}" required>
        </div>
        {% if setup %}
        <div class="mb-2">
          <label class="form-label" for="password2">Kennwort wiederholen</label>
          <input class="form-control" id="password2" type="password" autocomplete="new-password" required>
          <div class="form-text">Mindestens 6 Zeichen.</div>
        </div>
        {% endif %}
        <div class="text-danger small mb-2 d-none" id="error"></div>
        <button class="btn btn-primary w-100" type="submit">{{ 'Zugang festlegen' if setup else 'Anmelden' }}</button>
      </form>
    </div>
  </div>
  <div class="text-muted small mt-3">Version {{ version }}</div>
</div>
<script>
  const setup = {{ 'true' if setup else 'false' }};
  document.getElementById("form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const err = document.getElementById("error");
    err.classList.add("d-none");
    const user = document.getElementById("user").value;
    const password = document.getElementById("password").value;
    if (setup && password !== document.getElementById("password2").value) {
      err.textContent = "Die Kennwörter stimmen nicht überein.";
      err.classList.remove("d-none");
      return;
    }
    const r = await fetch(setup ? "/api/auth/setup" : "/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user, password })
    });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) {
      location.href = "/";
    } else {
      err.textContent = j.error || ("Fehler " + r.status);
      err.classList.remove("d-none");
    }
  });
</script>
</body>
</html>
