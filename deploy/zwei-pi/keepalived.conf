# Vorlage fuer /etc/keepalived/keepalived.conf (beide Pis).
# Koffer-Pi: Prioritaet 150, Bad-Pi: 100. Platzhalter ersetzt install-zwei-pi.sh.
global_defs {
  script_user root
  enable_script_security
}

vrrp_script stoppuhr_bereit {
  script "/usr/local/bin/stoppuhr-pruefen.sh"
  interval 2
  fall 2
  rise 2
}

vrrp_instance STOPPUHR {
  state BACKUP
  interface br0
  virtual_router_id 51
  priority __PRIORITY__
  advert_int 1
  # Nach Rueckkehr des Koffer-Pi erst 10 s warten, damit der Abgleich sicher fertig ist
  preempt_delay 10
  unicast_src_ip __OWN_IP__
  unicast_peer { __PEER_IP__ }
  virtual_ipaddress { __VIP__/24 }
  track_script { stoppuhr_bereit }
  notify "/usr/local/bin/stoppuhr-rolle.sh"
}
